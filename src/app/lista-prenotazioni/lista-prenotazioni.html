<mat-card class="mx-auto mt-4 w-75">
    <mat-card-header>
        <mat-card-title>{{tableTitle}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <app-form [formConfig]="cercaPrenotazioneFormConfig" submitLabel="cerca" (formSubmit)="onFormSubmit($event)">
        </app-form>

        <mat-divider class="my-3"></mat-divider>

        <app-table [data]="prenotazioniTest" [tableHeader]="tableHeader" [url]="url" [totalPages]="totalPages"
            [tableTitle]="tableTitle" (elimina)="eliminaPrenotazioneParent($event)" (pagina)="aPagina($event)">
        </app-table>
    

    </mat-card-content>
</mat-card>
